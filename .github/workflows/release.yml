name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading v) — only used for manual dry runs"
        required: false
        default: "0.0.0-dev"

env:
  CARGO_TERM_COLOR: always

# A new run supersedes an older in-progress one for the same ref, so
# repeated dry-runs don't pile up and starve the limited macOS runners.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # macOS (Apple Silicon). Builds three CLAP plugins, packages each as a
  # .clap bundle (directory + Info.plist), ad-hoc signs them, zips, uploads.
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS arm64
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # clap-wrapper submodule is needed for the VST3 build step.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version || '0.0.0-dev' }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building $V"

      - name: Build plugins
        run: |
          # Every plugin crate in cmake/plugin_list.cmake — the one list the bundle,
          # wrapper and installer steps also read (a hand-typed list here lost
          # Multiband/Morph/Double/Space in 0.16.0).
          cargo build --release $(grep -oE '^ +"superduper-[a-z0-9-]+' cmake/plugin_list.cmake | tr -d ' "' | sed 's/^/-p /')

      - name: Run tests
        run: |
          cargo test --release --no-fail-fast \
            -p superduper-reverb \
            -p superduper-supermass \
            -p superduper-spectrum \
            -p superduper-saturator \
            -p superduper-delay \
            -p superduper-compressor \
            -p superduper-eq \
            -p superduper-limiter \
            -p superduper-ambient \
            -p superduper-pad \
            -p superduper-vocal \
            -p superduper-wave \
            -p superduper-kubyz \
            -p superduper-chorus \
            -p superduper-drum \
            -p superduper-sampler \
            -p superduper-piano \
            -p superduper-looper \
            -p superduper-filter \
            -p superduper-midside \
            -p superduper-lineq \
            -p superduper-soothe \
            -p superduper-vocoder \
            -p superduper-pitch \
            -p superduper-nam \
            -p superduper-harmonic \
            -p superduper-tune \
            -p superduper-formant \
            -p superduper-granular \
            -p superduper-stretch \
            -p superduper-wind \
            -p superduper-multiband \
            -p superduper-morph \
            -p superduper-double \
            -p superduper-denoise \
            -p superduper-space \
            -p superduper-synth-core

      - name: Package .clap bundles
        env:
          V: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/macos
          grep -E '^\s+"superduper-' cmake/plugin_list.cmake | tr -d ' "' | while IFS='|' read -r crate name bundle_id _rest
          do
              dylib_stem="${crate//-/_}"
              dylib="target/release/lib${dylib_stem}.dylib"
              [[ -f "$dylib" ]] || { echo "missing $dylib"; exit 1; }
              bundle="dist/macos/${name}.clap"
              mkdir -p "$bundle/Contents/MacOS"
              cp "$dylib" "$bundle/Contents/MacOS/$name"
              cat > "$bundle/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>English</string>
              <key>CFBundleExecutable</key><string>$name</string>
              <key>CFBundleIdentifier</key><string>$bundle_id</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key><string>$name</string>
              <key>CFBundlePackageType</key><string>BNDL</string>
              <key>CFBundleShortVersionString</key><string>$V</string>
              <key>CFBundleVersion</key><string>$V</string>
              <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict>
          </plist>
          EOF
              codesign --force --sign - --deep "$bundle" || true
              (cd dist/macos && zip -qry "../${name}-${V}-macos-arm64.zip" "${name}.clap")
          done
          (cd dist/macos && zip -qry "../superduper-dsp-${V}-macos-arm64.zip" \
              SuperDuperReverb.clap SuperDuperSupermass.clap SuperDuperSpectrum.clap \
              SuperDuperSaturator.clap SuperDuperDelay.clap SuperDuperCompressor.clap \
              SuperDuperEq.clap SuperDuperLimiter.clap SuperDuperAmbient.clap \
              SuperDuperPad.clap SuperDuperVocal.clap SuperDuperWave.clap \
              SuperDuperKubyz.clap SuperDuperChorus.clap SuperDuperDrum.clap \
              SuperDuperSampler.clap SuperDuperLooper.clap SuperDuperFilter.clap \
              SuperDuperMidSide.clap SuperDuperLineq.clap SuperDuperSoothe.clap \
              SuperDuperNam.clap SuperDuperVocoder.clap SuperDuperPitch.clap \
              SuperDuperHarmonic.clap SuperDuperTune.clap)
          (cd dist && shasum -a 256 *.zip > SHA256SUMS-macos.txt)
          ls -la dist/

      # The wrapper build is 30 plugins x (VST3 SDK + AudioUnit SDK) of C++.
      # rust-cache does nothing for it, so every release recompiled the SDKs
      # from scratch: v0.13.0 spent its entire six-hour job limit here and was
      # killed before uploading a single macOS artifact.
      - name: Install ccache
        run: brew install ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-wrappers-${{ runner.os }}-${{ hashFiles('tools/clap-wrapper-patches/*.patch', 'cmake/plugin_list.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-wrappers-${{ runner.os }}-
      - name: Cache the CMake tree
        uses: actions/cache@v4
        with:
          path: build-wrappers
          key: cmake-wrappers-${{ runner.os }}-${{ hashFiles('cmake/plugin_list.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            cmake-wrappers-${{ runner.os }}-

      - name: Build VST3 + AU wrappers
        # A hang fails in 90 minutes, not at the job's limit: v0.15.0 sat 6 h
        # here (11.5 min on a laptop). Not `timeout 90m` in the script — macOS
        # runners have no GNU timeout, and that line failed 0.16.1 with 127.
        timeout-minutes: 90
        env:
          V: ${{ steps.ver.outputs.version }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 2G
        shell: bash
        run: |
          set -euo pipefail
          # Install the built .clap bundles into the user CLAP folder so
          # the wrapper's runtime search can find them. (The wrapper does
          # have a fallback to look inside its own bundle but the system
          # path is simpler.)
          mkdir -p "$HOME/Library/Audio/Plug-Ins/CLAP"
          cp -R dist/macos/SuperDuper*.clap "$HOME/Library/Audio/Plug-Ins/CLAP/"
          # CMake configure + build. The script handles patch application
          # idempotently and picks the right SDK if available.
          bash scripts/build_wrappers.sh

          mkdir -p dist/vst3 dist/au
          for vst3 in build-wrappers/SuperDuper*.vst3; do
              [[ -d "$vst3" ]] || continue
              name="$(basename "$vst3" .vst3)"
              cp -R "$vst3" "dist/vst3/${name}.vst3"
              codesign --force --sign - --deep "dist/vst3/${name}.vst3" || true
              (cd dist/vst3 && zip -qry "../${name}-${V}-macos-arm64-vst3.zip" "${name}.vst3")
          done
          for au in build-wrappers/SuperDuper*.component; do
              [[ -d "$au" ]] || continue
              name="$(basename "$au" .component)"
              cp -R "$au" "dist/au/${name}.component"
              codesign --force --sign - --deep "dist/au/${name}.component" || true
              (cd dist/au && zip -qry "../${name}-${V}-macos-arm64-au.zip" "${name}.component")
          done
          (cd dist/vst3 && zip -qry "../superduper-dsp-${V}-macos-arm64-vst3.zip" SuperDuper*.vst3)
          (cd dist/au && zip -qry "../superduper-dsp-${V}-macos-arm64-au.zip" SuperDuper*.component)
          (cd dist && shasum -a 256 *vst3*.zip *au*.zip >> SHA256SUMS-macos.txt)

      - name: Build .pkg installer (CLAP / VST3 / AU chooser)
        env:
          V: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Agent tools for the .pkg (same set as scripts/build_mac_release.sh);
          # each tool built alone — a workspace build unifies features.
          cargo build --release -p sdsp-bus
          cargo build --release -p sdsp-chain
          mkdir -p dist/agent/bin dist/agent/skills
          cp target/release/sdsp-bus target/release/sdsp-chain dist/agent/bin/
          for b in dist/agent/bin/*; do codesign --force --sign - "$b" || true; done
          for s in sdsp-mix superduper-song sdsp-chain audio-to-midi; do ditto "skills/$s" "dist/agent/skills/$s"; done
          bash installer/macos/build_pkg.sh "$V"
          cp "dist/SuperDuperDSP-${V}-macos-arm64.pkg" dist/SuperDuperDSP-macos-arm64.pkg
          (cd dist && shasum -a 256 *.pkg >> SHA256SUMS-macos.txt)
          ls -la dist/*.pkg

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/*.zip
            dist/*.pkg

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.zip
            dist/*.pkg
            dist/SHA256SUMS-macos.txt

  # ---------------------------------------------------------------------------
  # Windows x86_64. CLAP on Windows is a single `.clap` file (renamed .dll),
  # not a bundle directory. Build, rename, zip, upload.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # clap-wrapper — needed for the VST3 build step
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version || '0.0.0-dev' }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build plugins
        run: |
          # Every plugin crate in cmake/plugin_list.cmake (see the macOS job).
          $crates = Select-String -Path cmake/plugin_list.cmake -Pattern '^\s+"(superduper-[a-z0-9-]+)\|' | ForEach-Object { "-p"; $_.Matches[0].Groups[1].Value }
          cargo build --release @crates

      - name: Run tests
        run: |
          cargo test --release --no-fail-fast `
            -p superduper-reverb `
            -p superduper-supermass `
            -p superduper-spectrum `
            -p superduper-saturator `
            -p superduper-delay `
            -p superduper-compressor `
            -p superduper-eq `
            -p superduper-limiter `
            -p superduper-ambient `
            -p superduper-pad `
            -p superduper-vocal `
            -p superduper-wave `
            -p superduper-kubyz `
            -p superduper-chorus `
            -p superduper-drum `
            -p superduper-sampler `
            -p superduper-piano `
            -p superduper-looper `
            -p superduper-filter `
            -p superduper-midside `
            -p superduper-lineq `
            -p superduper-soothe `
            -p superduper-vocoder `
            -p superduper-pitch `
            -p superduper-nam `
            -p superduper-harmonic `
            -p superduper-tune `
            -p superduper-formant `
            -p superduper-granular `
            -p superduper-stretch `
            -p superduper-wind `
            -p superduper-multiband `
            -p superduper-morph `
            -p superduper-double `
            -p superduper-denoise `
            -p superduper-space `
            -p superduper-synth-core

      - name: Package .clap files
        shell: pwsh
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path dist/clap | Out-Null
          # From cmake/plugin_list.cmake, like the build step above.
          $plugins = Select-String -Path cmake/plugin_list.cmake -Pattern '^\s+"(superduper-[a-z0-9-]+)\|([A-Za-z]+)\|' | ForEach-Object {
            @{ dll = ($_.Matches[0].Groups[1].Value -replace '-', '_') + ".dll"; name = $_.Matches[0].Groups[2].Value }
          }
          foreach ($p in $plugins) {
            $src = "target/release/$($p.dll)"
            $clap = "dist/$($p.name).clap"
            Copy-Item -Path $src -Destination $clap -Force
            Copy-Item -Path $clap -Destination "dist/clap/$($p.name).clap" -Force  # installer payload
            Compress-Archive -Path $clap -DestinationPath "dist/$($p.name)-$env:V-windows-x64.zip" -Force
          }
          $combined = $plugins | ForEach-Object { "dist/$($_.name).clap" }
          Compress-Archive -Path $combined -DestinationPath "dist/superduper-dsp-$env:V-windows-x64.zip" -Force
          Get-FileHash -Algorithm SHA256 dist/*.zip | Format-Table -AutoSize | Out-File -FilePath dist/SHA256SUMS-windows.txt -Encoding ascii
          Get-ChildItem dist/

      - name: Build VST3 wrappers
        shell: bash
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # clap-wrapper VST3 build (MSVC). AUv2 is Apple-only → off here.
          # Align the MSVC runtime CRT across ALL targets: the VST3 SDK defaults
          # to static /MT while clap-wrapper's export obj is /MD → LNK2038/LNK1169.
          # Force everything to the dynamic CRT (/MD) to match.
          cmake -B build-wrappers -DCMAKE_BUILD_TYPE=Release \
            -DCLAP_WRAPPER_DOWNLOAD_DEPENDENCIES=ON \
            -DCLAP_WRAPPER_BUILD_AUV2=OFF \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL \
            -DSMTG_USE_STATIC_CRT=OFF
          cmake --build build-wrappers --config Release
          mkdir -p dist/vst3
          found=0
          while IFS= read -r -d '' v; do
            cp -R "$v" "dist/vst3/$(basename "$v")"; found=1
          done < <(find build-wrappers -type d -name '*.vst3' -prune -print0)
          [[ $found == 1 ]] || { echo "no VST3 bundles built under build-wrappers"; exit 1; }
          (cd dist/vst3 && 7z a -tzip "../superduper-dsp-${V}-windows-x64-vst3.zip" . >/dev/null)
          ls -la dist/vst3

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          # iscc ships on the windows-latest image.
          & iscc "/DMyAppVersion=$env:V" installer\windows\superduper.iss
          # Stable name for releases/latest/download (the site's Windows button).
          Copy-Item "dist/SuperDuperDSP-$env:V-windows-x64-Setup.exe" "dist/SuperDuperDSP-windows-x64-Setup.exe"
          Get-ChildItem dist/*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Add-Content dist/SHA256SUMS-windows.txt
          Get-ChildItem dist/*.exe

      - name: Upload artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.exe

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS-windows.txt

  # ---------------------------------------------------------------------------
  # Release notes — populates the body of the GitHub Release after both
  # build jobs finish. Skipped on workflow_dispatch.
  # ---------------------------------------------------------------------------
  release-notes:
    name: Generate release notes
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          # A body written by hand before CI finished (local macOS builds) stays;
          # the generated part goes under it.
          append_body: true
          body: |
            SuperDuper DSP ${{ github.ref_name }}

            Eighteen plugins — twelve effects + six instruments:

            **Effects:**
            * SuperDuper Reverb — Dattorro plate with sidechain ducking
            * SuperDuper Supermass — Valhalla-style cascade reverb
            * SuperDuper Spectrum — analyzer (Spectrum / Spectrogram / Split)
            * SuperDuper Saturator — tape / tube / soft-clip warmth, 2×/4× oversampling
            * SuperDuper Delay — Lagrange-interp delay, tape-flavoured feedback, ping-pong, sidechain ducking
            * SuperDuper Compressor — soft-knee, lookahead, sidechain HPF, auto-release, GR meter, PDC
            * SuperDuper EQ — 3-band parametric RBJ biquad + HP/LP
            * SuperDuper Limiter — lookahead brickwall, 4× true-peak detection, PDC
            * SuperDuper Vocal — split-band de-esser + mouth de-clicker for rap
            * SuperDuper Chorus — multi-tap modulated delay with band-named factory presets
            * SuperDuper Looper — Mobius-style 4-track live looper with host-BPM sync
            * SuperDuper Filter — multi-mode resonant filter (LP/HP/BP/Notch) with Drive, LFO (tempo sync) and Env Follow; Daft Punk sweeps on the master bus
            * SuperDuper Vocoder — 16-band channel vocoder, robot voice / talkbox (Daft Punk / Kraftwerk), internal or sidechain carrier
            * SuperDuper Pitch — manual voice pitch shifter with independent formant control (TD-PSOLA); chipmunk / bass / gender-flip

            **Instruments:**
            * SuperDuper Ambient — autonomous 4-voice chord-drone generator
            * SuperDuper Pad — polyphonic MIDI synth, 8-voice PadVoice + TPT/ZDF SVF
            * SuperDuper Wave — wavetable bass/lead with mouse-editable curve + 2-slot mod matrix
            * SuperDuper Kubyz — physical-model jaw-harp / khomus with vowel pad + mouth trajectory
            * SuperDuper Drum — analog drum machine (Kick/Snare/HH/Clap/Cowbell) with on-screen pad UI
            * SuperDuper Sampler — polyphonic WAV player with YIN pitch tuner, multi-mode filter, velocity-mod, reverse playback

            **Plugin formats:**
            - **CLAP** (`*-macos-arm64.zip`, `*-windows-x64.zip`) — native CLAP hosts (REAPER, Bitwig, …).
            - **VST3** (`*-macos-arm64-vst3.zip`) — wrapped via clap-wrapper for DaVinci, Cubase, Ableton, FL, Studio One.
            - **Audio Unit v2** (`*-macos-arm64-au.zip`) — wrapped via clap-wrapper for Logic Pro and any AU host.

            Install: download the platform zip and follow `INSTALL.md`.

            macOS install needs **one extra step** because the bundles are
            not notarised yet:

            ```bash
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/CLAP/SuperDuper*.clap
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/SuperDuper*.vst3
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/SuperDuper*.component
            ```

            > VST3 and AU wrappers dynamically load the matching `.clap` from
            > `~/Library/Audio/Plug-Ins/CLAP/`. Always install the CLAP zip
            > alongside the wrapper one.
