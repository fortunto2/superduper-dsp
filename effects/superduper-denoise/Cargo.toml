[package]
name = "superduper-denoise"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Noise and room-reverb remover — Spectral (adaptive or learned profile) and Dereverb modes; Neural (RNNoise) reserved."

[lib]
name = "superduper_denoise"
crate-type = ["cdylib", "rlib"]

[dependencies]
clack-plugin = "0.1"
clack-extensions = { version = "0.1", features = ["params", "audio-ports", "state", "gui", "latency", "track-info", "clack-plugin", "raw-window-handle_05"] }
clack-common = "0.1"
atomic_float = "1"
parking_lot = "0.12"
superduper-dsp-sdk = { path = "../../sdk" }
superduper-synth-core = { path = "../../synth-core", features = ["gui"] }
superduper-restore = { path = "../../restore" }

egui = "0.33"
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview" }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "237d323c729f3aa99476ba3efa50129c5e86cad3" }
raw-window-handle = "0.5"

[build-dependencies]
superduper-dsp-sdk-build = { path = "../../sdk-build" }

[dev-dependencies]
sdsp-test-kit = { path = "../../tools/sdsp-test-kit" }
