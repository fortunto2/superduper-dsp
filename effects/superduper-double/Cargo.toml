[package]
name = "superduper-double"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Vocal doubler — 1-4 re-sung doubles, each drifting in time and pitch (PSOLA, formants kept), with Tuned / Tuned Lead modes"

[lib]
name = "superduper_double"
crate-type = ["cdylib", "rlib"]

[dependencies]
clack-plugin = "0.1"
clack-extensions = { version = "0.1", features = ["params", "audio-ports", "state", "gui", "latency", "track-info", "clack-plugin", "raw-window-handle_05"] }
clack-common = "0.1"
atomic_float = "1"
parking_lot = "0.12"
superduper-dsp-sdk = { path = "../../sdk" }
superduper-synth-core = { path = "../../synth-core", features = ["gui"] }

# GUI stack — must match versions used across the suite.
egui = "0.33"
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview" }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "237d323c729f3aa99476ba3efa50129c5e86cad3" }
raw-window-handle = "0.5"

[build-dependencies]
superduper-dsp-sdk-build = { path = "../../sdk-build" }

[dev-dependencies]
sdsp-test-kit = { path = "../../tools/sdsp-test-kit" }
clack-host = { version = "0.1", features = ["clack-plugin"] }
clack-extensions = { version = "0.1", features = ["params", "audio-ports", "state", "latency", "log", "clack-host"] }
superduper-synth-core = { path = "../../synth-core" }
realfft = "3.5"
