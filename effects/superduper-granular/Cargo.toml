[package]
name = "superduper-granular"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Real-time granular cloud — chop audio into grains, freeze it into a pad"

[lib]
name = "superduper_granular"
crate-type = ["cdylib", "rlib"]

[dependencies]
clack-plugin = "0.1"
clack-extensions = { version = "0.1", features = ["params", "audio-ports", "note-ports", "state", "gui", "clack-plugin", "raw-window-handle_05"] }
clack-common = "0.1"
atomic_float = "1"
parking_lot = "0.12"
superduper-dsp-sdk = { path = "../../sdk" }
superduper-synth-core = { path = "../../synth-core", features = ["gui"] }

# GUI stack — must match versions used in superduper-reverb / saturator.
egui = "0.33"
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview" }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "237d323c729f3aa99476ba3efa50129c5e86cad3" }
raw-window-handle = "0.5"

[build-dependencies]
superduper-dsp-sdk-build = { path = "../../sdk-build" }

[dev-dependencies]
clack-host = { version = "0.1", features = ["clack-plugin"] }
superduper-dsp-sdk = { path = "../../sdk" }
clack-extensions = { version = "0.1", features = ["params", "audio-ports", "state", "log", "clack-host"] }
superduper-synth-core = { path = "../../synth-core" }
