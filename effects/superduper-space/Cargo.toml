[package]
name = "superduper-space"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Spatial panner — place a track in the room: VBAP to stereo, quad, 5.1, 7.1 or 7.1.4, distance cues, an MCP position document."

[lib]
name = "superduper_space"
crate-type = ["cdylib", "rlib"]

[dependencies]
clack-plugin = "0.1"
clack-extensions = { version = "0.1", features = ["params", "audio-ports", "state", "gui", "track-info", "clack-plugin", "raw-window-handle_05"] }
clack-common = "0.1"
atomic_float = "1"
parking_lot = "0.12"
serde_json = { version = "1", features = ["preserve_order"] }
superduper-dsp-sdk = { path = "../../sdk" }
superduper-synth-core = { path = "../../synth-core", features = ["gui"] }

egui = "0.33"
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview" }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "237d323c729f3aa99476ba3efa50129c5e86cad3" }
raw-window-handle = "0.5"

[build-dependencies]
superduper-dsp-sdk-build = { path = "../../sdk-build" }

[dev-dependencies]
clack-extensions = { version = "0.1", features = ["params", "audio-ports", "log", "state", "clack-host"] }
sdsp-test-kit = { path = "../../tools/sdsp-test-kit" }
clack-host = { version = "0.1", features = ["clack-plugin"] }
