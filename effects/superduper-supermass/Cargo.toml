[package]
name = "superduper-supermass"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cascade reverb + chorus (Valhalla Supermassive-style) — standalone CLAP plugin"

[lib]
name = "superduper_supermass"
crate-type = ["cdylib", "rlib"]

[dependencies]
clack-plugin = "0.1"
clack-extensions = { version = "0.1", features = ["params", "audio-ports", "clack-plugin"] }
clack-common = "0.1"
atomic_float = "1"
parking_lot = "0.12"
fundsp = "0.23"
superduper-dsp-sdk = { path = "../../sdk" }
superduper-synth-core = { path = "../../synth-core" }

[build-dependencies]
superduper-dsp-sdk-build = { path = "../../sdk-build" }

[dev-dependencies]
clack-host = { version = "0.1", features = ["clack-plugin"] }
clack-extensions = { version = "0.1", features = ["params", "audio-ports", "log", "clack-host"] }
superduper-synth-core = { path = "../../synth-core" }
