[package]
name = "superduper-restore"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Audio restoration DSP: spectral noise gating (adaptive or learned profile) and late-reverb suppression. Zero dependencies, offline or real-time."

[lib]
name = "superduper_restore"

# Empty by default, like superduper-loudness: the plugin wraps it, and video and
# wasm tools run it offline without the plugin stack. `neural` pulls RNNoise.
[dependencies]
nnnoiseless = { version = "0.5.2", default-features = false, optional = true }

[features]
default = []
# Neural mode: RNNoise (pure Rust, model compiled in, 48 kHz only).
neural = ["dep:nnnoiseless"]
