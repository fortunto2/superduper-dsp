[package]
name = "superduper-restore"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Audio restoration DSP: spectral noise gating (adaptive or learned profile), late-reverb suppression and RNNoise. Pure Rust, wasm-friendly, offline or real-time."

[lib]
name = "superduper_restore"

# Only the shared STFT (superduper-dsp-core on realfft, pure Rust, builds for wasm): the
# plugin wraps this crate, and video and wasm tools run it offline without the plugin stack.
# `neural` pulls RNNoise.
[dependencies]
superduper-dsp-core = { path = "../dsp-core", features = ["stft"] }
nnnoiseless = { version = "0.5.2", default-features = false, optional = true }

[features]
default = []
# Neural mode: RNNoise (pure Rust, model compiled in, 48 kHz only).
neural = ["dep:nnnoiseless"]
