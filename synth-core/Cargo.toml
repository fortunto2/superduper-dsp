[package]
name = "superduper-synth-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared DSP code for SuperDuper synth/effect plugins (ported from rust-synth)"

[lib]
name = "superduper_synth_core"

[dependencies]
fundsp = "0.23"
realfft = "3.5"

# GUI helpers are opt-in (every effect plugin enables them via
# `superduper-synth-core = { path = "...", features = ["gui"] }`).
# Tests-only consumers don't pay the egui compile cost.
atomic_float = { version = "1", optional = true }
egui = { version = "0.33", optional = true }
superduper-dsp-sdk = { path = "../sdk", optional = true }

[features]
default = []
gui = ["dep:atomic_float", "dep:egui", "dep:superduper-dsp-sdk"]
