[package]
name = "superduper-synth-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared DSP code for SuperDuper synth/effect plugins (ported from rust-synth)"

[lib]
name = "superduper_synth_core"

[dependencies]
fundsp = "0.23"
realfft = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = { version = "0.12", optional = true }
# SIMD primitives for NAM inference — `wide` is stable-Rust + cross-arch
# (NEON on aarch64, SSE/AVX on x86_64), uses intrinsics under the hood.
wide = "0.7"
# SFZ sample decoding (FLAC / WAV / OGG) — only behind `sfz-load`, the parser
# and engine stay dependency-free for iOS.
symphonia = { version = "0.5.5", optional = true, default-features = false, features = ["flac", "wav", "pcm", "ogg", "vorbis"] }

# GUI helpers are opt-in (every effect plugin enables them via
# `superduper-synth-core = { path = "...", features = ["gui"] }`).
# Tests-only consumers don't pay the egui compile cost.
atomic_float = { version = "1", optional = true }
egui = { version = "0.33", optional = true }
superduper-dsp-sdk = { path = "../sdk", optional = true }
# Track name for the bus publisher (CLAP track-info), GUI feature only.
clack-plugin = { version = "0.1", optional = true }
clack-extensions = { version = "0.1", optional = true, features = ["track-info", "clack-plugin"] }

[features]
default = []
sfz-load = ["dep:symphonia"]
gui = ["dep:atomic_float", "dep:egui", "dep:superduper-dsp-sdk", "dep:parking_lot", "dep:clack-plugin", "dep:clack-extensions"]

[dev-dependencies]
proptest = "1"
# Test fixtures only. Cargo allows the cycle (test-kit depends on this crate)
# for dev-dependencies, and it keeps the reference signals out of the shipping
# library, which cross-compiles to iOS.
sdsp-test-kit = { path = "../tools/sdsp-test-kit" }
# Only for `examples/kubyz_f2.rs` — writing a WAV of the rendered instrument.
hound = "3.5"

# These two decode samples, which lives behind `sfz-load`; without the
# feature they must not be built, or `cargo test -p superduper-synth-core`
# fails before running a single test (2026-10-21).
[[example]]
name = "sfz_render"
required-features = ["sfz-load"]

[[example]]
name = "drum_classify"
required-features = ["sfz-load"]
