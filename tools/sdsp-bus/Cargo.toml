[package]
name = "sdsp-bus"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Show what every SuperDuper plugin instance is publishing on the shared bus, and serve it over MCP"

[dependencies]
superduper-dsp-sdk = { path = "../../sdk" }
superduper-synth-core = { path = "../../synth-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "1.7", features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { workspace = true, features = ["rt", "macros", "net", "time"] }
tokio-util = "0.7"
axum.workspace = true
