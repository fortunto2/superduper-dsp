# Example mashup: the stems of one song's beat under another song's vocal.
# Split both songs into stems first (demucs, model htdemucs), then point
# every `path` below at your own files (paths are resolved from the folder you
# run the command in). Run:
#
#   cargo run --release -p sdsp-mash -- tools/sdsp-mash/example.toml out.wav
#
# This example needs no time-stretch, so both sources must already share a
# tempo; set `bpm` to the beat's tempo (`sdsp-mash analyze <wav>` measures it).

bpm = 105.5

# ── Beat: drums + bass + other stems of the beat song ─────────────────────
# Trimmed to 60 s so the example renders quickly; drop `len_sec` for the
# full track.

[[track]]
path = "stems/beat/drums.wav"
role = "beat-drums"
gain_db = 0.0
len_sec = 60.0

[[track]]
path = "stems/beat/bass.wav"
role = "beat-bass"
gain_db = 1.0
len_sec = 60.0

[[track]]
path = "stems/beat/other.wav"
role = "beat-other"
gain_db = -1.0
len_sec = 60.0

# ── Vocal: the vocals stem of the other song ─────────────────────────────
# Skip the 10.4 s intro of the a-cappella, then drop the first verse in near
# bar 8 of the grid (8 bars × 4 beats = 32 beats). `auto_align` snaps it onto
# the drums (±half-bar). High-pass clears rumble/plosives; the compressor
# evens out the rap delivery.

[[track]]
path = "stems/vocal/vocals.wav"
role = "vocal"
gain_db = -1.0
start_sec = 10.4
offset_beats = 32.0
len_sec = 45.0
auto_align = true
highpass_hz = 120.0
comp = { threshold_db = -18.0, ratio = 3.0, attack_ms = 5.0, release_ms = 90.0, makeup_db = 2.0 }

# ── Sidechain duck: the vocal ducks only the "other" bus ──────────────────
# Bass and drums punch through; the melodic "other" bed gets out of the way
# of the rap.

[duck]
threshold_db = -30.0
ratio = 4.0
attack_ms = 8.0
release_ms = 140.0
knee_db = 6.0

# ── Intro lowpass sweep on the beat bus ───────────────────────────────────
# The beat opens from 350 Hz to fully bright over the first 8 bars so the
# drop lands when the vocal enters.

[intro_sweep]
bars = 8
from_hz = 350.0
to_hz = 20000.0

# ── Master chain (same plugins sdsp-chain hosts) ──────────────────────────

[[master]]
plugin = "eq"
# 7 = HP (Hz) — clear sub rumble; 6 = High Gain (dB) — a little air.
params = { "7" = 30.0, "6" = 1.5 }

[[master]]
plugin = "compressor"
# 0 Threshold dB, 1 Ratio, 2 Attack ms, 3 Release ms, 5 Makeup dB — gentle glue.
params = { "0" = -18.0, "1" = 2.0, "2" = 30.0, "3" = 200.0, "5" = 2.0 }

[[master]]
plugin = "limiter"
# 0 Input dB (drive into the limiter for loudness), 1 Ceiling dBTP.
params = { "0" = 2.8, "1" = -2.8 }
