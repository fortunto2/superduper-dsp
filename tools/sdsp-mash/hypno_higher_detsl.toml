# у руля» (хук-лупы). Кубыз-сет: peak-time техно в тонике кубыза, юзер
# играет кубыз живьём поверх. Zero stretch, чоп-ретриггер на грид.
# Higher lattice 0.209 + k*0.441176; grooves A 16-110, ambient break 128-160,
# B 176-260. Фразы (word-timestamps): тизер «включайся в процесс, сейчас не
