# Kubyz trial 1 — Amelie Lens "Higher" (136.0, A#m) × башкирский кубыз (A#2 118.5 Hz).
# Tonic match: kubyz fundamental = the track's minor tonic. Zero stretch.
# Lattice 0.209 + k*0.441176; grooves: A 16-110, own ambient break 128-160, B 176-260.
# Arc: intro (break-zone bed + drone) → groove + licks → BREAKDOWN kubyz solo
# over the track's own ambient break → drop + escalating licks → tape stop + stab.

