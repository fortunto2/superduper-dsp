# Finale: tape stop + closing lowpass together, echo reads the dying tape.
[[fx]]
kind = "tape_stop"
at_beat = 184.0
len_beats = 4

[[fx]]
kind = "filter_sweep"
at_beat = 184.0
len_beats = 4
from_hz = 16000.0
to_hz = 250.0

[[fx]]
kind = "echo_out"
at_beat = 186.0
len_beats = 3
feedback = 0.5
delay_ms = 651.0

[[master]]
plugin = "eq"
params = { "7" = 30.0, "1" = 1.5, "5" = 7000.0, "6" = 2.5 }

[[master]]
plugin = "compressor"
params = { "0" = -16.0, "1" = 2.0, "2" = 30.0, "3" = 200.0, "5" = 2.0 }

[[master]]
plugin = "limiter"
params = { "0" = 3.2, "1" = -2.8 }
