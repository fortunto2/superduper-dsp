# Mashup — Baby's Got A Temper × Marilyn Manson "Sweet Dreams".
#
#   sdsp-mash tools/sdsp-mash/mash_babys_sweetdreams.toml out.wav
#
# Grid 92.18 = Manson's native tempo (drums local zones 91.5 / 93.96 / 92.29,
# live band drifting) — the vocal stays at ratio 1.0 (screams 1.0165 to kill
# a 1.6% zone drift), the Baby's beat slows 105.71 → 92.18 (ratio 1.146778,
# −12.8%). The counter-stretch option (grid 96) was REJECTED by measurement:
# WSOLA transient sharpness on this stompy beat is identical at −8.8% and
# −12.8% (top-rise 8.8 vs 9.2 dB/5ms, native 10.1), and Manson at 1.0 >>
# Manson +4.7% chipmunk. Doom-slowed Baby's suits the cover's sludge.
# Baby's lattice: 22.02 + k*0.56758 (verified in mash_babys_withoutme).
# Manson quirks: verse 1 rides a drum-less riff (rubato) → placed per-line
# over a thin no-drums bed (original arrangement trick, drift invisible);
# whisper hallucinated an outro line at 290 (stem is silent there) and mapped
# the 155-170 screams as garbage — real scream zone found by RMS (peak −8.8 dB
# at 164-169, the hottest vocal in the song). Attacks by RMS slope; hook line 1
# cut at the 70 ms breath dip 33.05.
#
# Timeline (spb 0.650900, bar 2.603602), total ≈ 124 s:
#   beats   0- 16  intro — riff+bass bed, sweep, "Sweet dreams…" tease
#   beats  16- 48  verse 1 — whispered "Sweet dreams…" 4 lines, drums sneak @32
#   beats  48- 80  HOOK — "Some of them want to use you…" chant, full beat slams
#   beats  80- 96  verse 2 — verse-3 take (hot doubles), beat held down
#   beats  96-112  BREAKDOWN — "I wanna use you and abuse you" growl acapella
#   beats 112-144  THE DROP — "Hold your head up!" screams over the hottest zone
#   beats 144-176  culmination — final chant doubles, sub hits
#   beats 176-184  return — bed thins out, "Sweet dreams…" tease over it
#   beat  184      tape_stop + closing sweep + echo; final scream AFTER the stop
#
# Vocal balance = fixed Eminem recipe (verses +presence 3, screams presence 1.5,
# duck 3.5); whispered verse-1 source is ~10 dB quieter → per-block gain boost.

bpm = 92.18

[intro_sweep]
bars = 2
from_hz = 300.0
to_hz = 20000.0

[duck]
threshold_db = -28.0
ratio = 3.5
attack_ms = 8.0
release_ms = 140.0

[pump]
depth_db = 4.5
release_ms = 120.0

