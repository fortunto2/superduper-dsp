# Mashup — Firestarter × Eminem "Lose Yourself" (lead + hook-bridge).
#
#   sdsp-mash tools/sdsp-mash/mash_firestarter_loseyourself.toml out.wav
#
# Grid 171.62 = Lose Yourself's double-time reading (85.81 × 2) — the Eminem
# lead is COMPLETELY unstretched (ratio 1.0). Firestarter's beat is pulled up
# 141.46 → 171.62 (ratio 0.82426, +21% — DnB-ified breakbeat, half-time rap
# on top). Stem tempo measured by 64/128-beat comb correlation (141.42/141.50;
# the full-track 142.11 reading was biased by vocals).
# Em lattice: first downbeat 5.317 s, src beat 0.699225 s = 2 grid beats.
# Firestarter drum groove enters at 13.58 s (RMS attack) = beat-stem origin.
#
# Timeline (grid beat = 0.3496 s, bar = 1.3984 s):
#   beats   0- 56  intro sweep + spoken "Look, if you had one shot…" (full)
#   beats  56-176  verse — "Yo. His palms are sweaty … hope it don't"
#   beats 176-192  BREAKDOWN — drums+bass out, "You better lose yourself"
#                  pre-chorus pickup rides near-acapella into the drop
#   beats 192-252  chorus ×2 — "You better lose yourself in the music …"
#   beats 252-288  outro — "I'm a firestarter, twisted firestarter" ×3 escal.
#   beat  288      tape_stop + closing sweep + hook echo sails out
#                                                            total ≈ 102 s

bpm = 171.62

[intro_sweep]
bars = 8
from_hz = 300.0
to_hz = 20000.0

# Rap-vocal fix (2026-07-16): masking diagnosis — Em vocal came through the
# chain 4.7 dB lower than Zack's in the RATM reference (proj gain −6.3 vs
# −1.6 dB), and a rap timbre carries only ~30% of its energy in 1-3 kHz vs
# 42% for the RATM scream. Fixes: vocal gain −3 → +1, presence +3 dB @ 3 kHz,
# duck ratio 2.5 → 3.5, risers over continuous vocal 0.65/0.6 → 0.45.
[duck]
threshold_db = -28.0
ratio = 3.5
attack_ms = 8.0
release_ms = 140.0

[pump]
depth_db = 4.5
release_ms = 110.0

# ── the beat — Firestarter, 141.46 → 171.62 ──
# Native src beat 0.424149 s; grid↔source beats map 1:1. Drums+bass split
# around the pre-chorus breakdown (grid 176-192). Their second half re-uses
# the STRONG groove from src beat 80 (47.51 s) — the track's own quiet
# bridge (src 98-108 s) would otherwise land exactly on the chorus slam.
