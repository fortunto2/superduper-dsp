# Mashup — Fuel My Fire × Eminem "Lose Yourself" (lead + hook-bridge).
#
#   sdsp-mash tools/sdsp-mash/mash_fuelmyfire_loseyourself.toml out.wav
#
# The near-perfect tempo pair: Fuel My Fire 85.014 (drums-stem 128-beat comb
# correlation, corr 0.83) vs Lose Yourself 85.81 — beat stretched by just
# −0.93% (ratio 0.990724 on the 171.62 double-time grid), vocal untouched.
# Same vocal architecture as mash_firestarter_loseyourself.toml (identical
# cuts/anchors); the beat is the punk wall of Fuel My Fire instead.
# Bridge: FMF's own vocal stem is unusable for word-accurate cuts (shouted
# punk — whisper returns nothing), so the outro hook is Firestarter's
# "I'm a firestarter, twisted firestarter" — thematically on the nose.
# FMF drum groove enters at 13.81 s; the stem is a flat −11 dB wall after
# (no quiet-zone traps anywhere).
#
# Timeline (grid beat = 0.3496 s): same as the Firestarter version —
# intro+spoken 0-56, verse 56-176, breakdown 176-192, chorus drop 192,
# chorus ×2 to 252, hooks 252/264/276, tape_stop 288. Total ≈ 102 s.

bpm = 171.62

[intro_sweep]
bars = 8
from_hz = 300.0
to_hz = 20000.0

# Rap-vocal fix (2026-07-16): the worst masking gap of the three — the punk
# wall pushed the Em vocal through the chain 6.4 dB lower than Zack's in the
# RATM reference (proj gain −8.0 vs −1.6 dB). Fixes: vocal gain −3 → +1.5,
# presence +3 dB @ 3 kHz, duck ratio 2.5 → 4.0, beat-other (the guitar wall,
# the main 1-3 kHz masker) −1 → −2.5, risers over vocal trimmed.
[duck]
threshold_db = -30.0
ratio = 4.0
attack_ms = 8.0
release_ms = 140.0

[pump]
depth_db = 4.5
release_ms = 110.0

