# Mashup — Funky Shit × Rob Zombie "Dragula".
#
#   sdsp-mash tools/sdsp-mash/mash_funkyshit_dragula.toml out.wav
#
# The zero-stretch pair: Funky Shit drums comb-corr 124.99 (corr 0.9 machine
# grid, lattice 1.474 + k*0.480038), Dragula vocal zones 124.8-125.0.
# Grid = 124.99, EVERY track ratio 1.0. Vocal blocks re-anchored per block
# (0.16% native drift never accumulates past ~40 ms).
# Dragula quirk: chorus 1 rounds are exactly 16.04 beats apart, but later
# chorus pairs (3-4, final) are 17 beats apart — the final double chorus is
# placed as ONE continuous block so its internal 17-beat push stays intact.
# Vocal attacks measured by RMS slope on the stem (whisper-start lies by up
# to +0.4 s on distorted vocals): verses 30.89 / 46.26 / 77.03 / 92.35,
# breakdown 153.89, chorus kicks (drums stem) 53.96 / 191.41.
# Funky Shit groove map (drums RMS): A 48.5-107 (-14 dB), dip 108-119,
# B 132-178 (hottest, lattice bar 68 = 132.037), sparse riff 180-224,
# C 240-270. Bass dead at 32-44 and 184-207.
#
# Timeline (spb 0.4800384, bar 1.9201536), total ≈ 109 s:
#   beats   0- 16  intro sweep + spoken "Superstition, fear and jealousy"
#   beats  16- 61  verse 1 — "Dead I am the one…" + "Dead I am the sky…"
#   beats  64- 96  CHORUS 1 ×2 (riser + stutter + sub drop into it)
#   beats  96-144  verse 2 — "Dead I am the pool…" + "Dead I am the rat…"
#   beats 144-160  BREAKDOWN — "Dead I am the dog, hound of hell…" acapella
#   beats 160-176  build — long riser, "Superstition" tease, drums sneak in
#   beats 176-210  THE DROP — final double chorus on groove B
#   beats 210-218  intro-motif return over the beat
#   beat  218      tape_stop + closing sweep + echo; "Dragula!" scream lands
#                  AFTER the stop end over the dying echo
#
# Vocal balance = fixed Eminem recipe: growled rap-ish verses gain +1 /
# presence +3 dB @3 kHz, shouted choruses 0 / +2, duck ratio 3.5.

bpm = 124.99

[intro_sweep]
bars = 2
from_hz = 300.0
to_hz = 20000.0

[duck]
threshold_db = -28.0
ratio = 3.5
attack_ms = 8.0
release_ms = 140.0

[pump]
depth_db = 4.5
release_ms = 110.0

