path = "/private/tmp/claude-501/-Users-rustam-Music-1music/393ad8d2-47d0-4106-9e37-cd08541e3195/scratchpad/mash/htdemucs/Detsl aka Le Truk - Кто там у руля/vocals.wav"

# wave A — quiet intro motif
[[phrase]]
track = "detsl"
start_sec = 140.44
end_sec = 144.83
at_beat = 8.0
loops = 2
gain_db = 3.0

# wave B — first escalation
[[phrase]]
track = "detsl"
start_sec = 140.44
end_sec = 144.83
at_beat = 40.0
loops = 2
