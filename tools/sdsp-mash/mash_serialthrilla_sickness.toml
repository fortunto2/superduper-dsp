# Mashup — Serial Thrilla × Disturbed "Down With The Sickness".
#
#   sdsp-mash tools/sdsp-mash/mash_serialthrilla_sickness.toml out.wav
#
# Grid 181.34 = Disturbed's vocal double-time (drums local zones BOTH exactly
# 90.67, studio-tight IQR — the one non-drifting band of this batch), vocal
# ratio 1.0 everywhere. Serial Thrilla comb-corr 157.34 (machine) speeds up
# +15.3% (ratio 0.867648) — the Firestarter×Lose Yourself precedent: fast
# Prodigy break as DnB-feel under half-time metal vocal. Speed-up = safe side.
# ST lattice: kick 8.58 + k*0.381342; grooves A 8.6-88, B 200.8-240,
# break zone 248-260, C 264-296.
# Disturbed map (isolated-slice whisper — full-stem run missed the real first
# chorus): "Can you feel that?" 8.5, screams 19.2 / 28.7 (hot), verse 1
# "Drowning deep…" attack 53.16, verse 2 "Looking at my own reflection…"
# 74.35 (= V1 + exactly 32 native beats → ONE continuous verse block, zero
# re-anchor), CHORUS 1 "Get up!" 90.70 dead on its kick 90.72, bridge
# "It seems you're having some trouble…" 144.53 → "…woken up the demon,
# THE ENEMY!" ends 164.5 straight into the BIG chorus 166.21 (pickup before
# kick 166.40) ×4 rounds ending "…gift that has been given to me" 187.6.
# The 190-245 "mommy" spoken bridge is deliberately skipped. Final iconic
# "OOH WAH AH AH AH!" scream 275.22 (hottest moment, −9.8 dB) lands AFTER
# the tape stop — the KITN MOTHERF*CKER move.
#
# Timeline (spb 0.330876, bar 1.323504), total ≈ 120 s:
#   beats   0- 32  intro — thin drums + "Can you feel that?" + SCREAM tease
#                  riding the riser, full beat slams at 32
#   beats  32-144  verse 1+2 — one continuous block, V2 rides in at 96
#   beats 144-208  CHORUS 1 — "Get up! Come on get down with the sickness"
#   beats 208-240  BREAKDOWN — "It seems you're having some trouble…" acapella
#   beats 240-272  build — "…woken up the demon, THE ENEMY!" over the riser
#   beats 272-336  THE DROP — big chorus ×4 on groove C, "…gift given to me"
#                  lands exactly on the return downbeat
#   beats 336-344  return — "Can you feel that?" over thin drums
#   beat  344      tape_stop + closing sweep + echo; final scream AFTER stop
#
# Vocal balance = fixed Eminem recipe (verses +1/presence 3, screams/chorus
# lower presence, duck 3.5).

