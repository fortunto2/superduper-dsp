# Mashup — Smack My Bitch Up × DMX "X Gon' Give It To Ya" (A-B-A beat switch).
#
#   sdsp-mash tools/sdsp-mash/mash_smbu_dmx.toml out.wav
#
# 136 vs 95 BPM has NO common grid inside the stretch tolerances (1:1 → beat
# −30%; 2:1 → beat +40%; 3:2/4:3 → polyrhythmic rap = mush), so this is a
# VERSUS structure on per-section tempi:
#   S1 @130 — SMBU beat statement + censored "change my pitch up" hooks
#   S2 @95.01 — DMX takes over COMPLETELY (his own instrumental as the beat,
#              both stems ratio 1.0 = bulletproof sync), SMBU hook stabs ride
#              the 95-grid as one-shots (unstretched, tempo-agnostic)
#   S3 @130 — SMBU beat slams back; the explicit hook EXACTLY ONCE, quiet
#              (−9 dB) and dub-thrown under the drop; tape-stop finale.
# SMBU beat cuts + censored-hook EDL timings reused from miniset_smbu.toml
# (native 136.19 → 130, ratio 1.0476; hook onsets 77.5 / 251.3).
# DMX lattice: first downbeat 0.488 s, beat 0.63151 s; S2 source starts at
# bar 25.75 s (beat 40) — chorus 1 → verse 1 → chorus 2, vocal cut ends
# before verse 2 ("He ain't…" @ 87.16).
#
# Global grid 130 (spb 0.461538): S2 @ beat 64 (29.54 s), S3 @ beat 200
# (92.31 s), tape stop @ beat 256 (118.15 s). Total ≈ 2:02.

bpm = 130.0

[intro_sweep]
bars = 4
from_hz = 300.0
to_hz = 20000.0

[duck]
threshold_db = -28.0
ratio = 2.5
attack_ms = 8.0
release_ms = 140.0

[pump]
depth_db = 4.5
release_ms = 120.0

