# Mashup — Smack My Bitch Up × Rage Against The Machine "Killing In The Name".
#
#   sdsp-mash tools/sdsp-mash/mash_smbu_killing.toml out.wav
#
# RATM is a live band that ACCELERATES through this song — per-zone vocal tempo
# measured from repetition periods (whisper onsets + drums beat-track):
#   verse "Some of those…"      ≈ 158.4 (double-time)
#   chant "Now you do what…"    ≈ 184.5
#   "F*ck you…" quiet           ≈ 172-178 (drifting)
#   "F*ck you…" screamed        ≈ 178-185 (drifting)
# A single global grid (171.72 avg) would fight EVERY zone by 4-8 %, so this is
# built on per-section tempo islands; the SMBU beat is re-stretched per section
# (136.22 native, comb-corr 0.56/0.51 on the drums stem). The escalating
# stretch (+16 → +35 %) mirrors the original's own acceleration.
# Zack's vocal is NEVER stretched (ratio 1.0); the lead is cut into short
# blocks (7-14.5 s), each block's attack re-anchored on a grid downbeat, cuts
# in deep pauses (< −50 dB) or on the native drum beat before the attack so
# pickups keep their phrasing. SMBU dead zones (170-208 s, 332 s+) avoided;
# groove map: build 22-46, groove A 48-88 (drop at 48.10), groove B 88-134.
#
# Timeline (global grid 158.4, spb 0.378788):
#    0.0- 6.1  intro sweep + "Killing in the name of" tease ×2
#    6.1-29.4  S1 verse — "Some of those that work forces…" (2 blocks) @158.4
#   30.3       hook "Killing in the name of!" + auto drop-riser
#   33.3       S2 DROP — "And now you do what they told ya" chant @184.5,
#              SMBU build-zone beat runs frantic (+35 %) as a long build
#   48.9       S3 BREAKDOWN — drums+bass out, "F*ck you, I won't do what you
#              tell me" rides near-acapella over a quiet riff bed @175
#   64.0       S4 THE DROP — screamed chant slams on SMBU groove B @179
#   77.4       F2 re-anchor + sub hit; 88.2 final rep; 90.8 hook stab
#   94.9       tape_stop + closing sweep + "MOTHERF*CKER!" over the stopped
#              tape + echo out                                total ≈ 102 s
#
# Vocal balance = the fixed Eminem recipe (2026-07-16 masking diagnosis):
# rap-ish blocks gain +1 / presence +3 dB @3 kHz, screams −1 / presence +1.5,
# duck ratio 3.5.

