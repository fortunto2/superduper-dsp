# Mashup — Voodoo People × Rage Against The Machine "Wake Up".
#
#   sdsp-mash tools/sdsp-mash/mash_voodoo_wakeup.toml out.wav
#
# Grid 167.64 = Wake Up's analyze tempo — Zack's vocal is UNSTRETCHED.
# Voodoo People beat pulled up 149.016 → 167.64 (ratio 0.888905, +12.5%
# speedup; stem tempo by 128-beat comb correlation). RATM is a LIVE band —
# tempo drifts, so the lead is cut into SHORT blocks (≤28 s), each block's
# attack re-anchored on a grid downbeat so drift never accumulates across
# cuts. Voodoo drum groove enters at 19.37 s (bar-lattice verified: intro
# bar hits at 14.54/16.15/17.76 s, 1.6106 s spacing = 149.016).
#
# Timeline (grid beat = 0.35793 s, bar = 1.4317 s):
#   beats   0- 16  intro sweep + "Magic people, voodoo people" tease ×2
#   beats  16- 69  lead A — "…networks at work, keepin' people calm…"
#   beats  70- 78  mini-bridge — "The voodoo, who do what you don't dare do"
#   beats  80-206  lead B — the long verse, split at the 147.9 s pause and
#                  re-anchored at beat 128 (live-drift reset)
#   beats 208-224  BREAKDOWN — drums+bass out, "WAKE UP!" screams ride,
#                  scream tail bleeds over the drop
#   beats 224-272  payoff — chant ×2 → "How long? Not long!…" → voodoo-line
#   beat  272      tape_stop + closing sweep + echo out
#                                                            total ≈ 102 s

bpm = 167.64

[intro_sweep]
bars = 4
from_hz = 300.0
to_hz = 20000.0

[duck]
