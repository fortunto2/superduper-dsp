# ───────────────────────────── performance FX ─────────────────────────────
# beat_repeat stutter right before the S3 beat change.
[[fx]]
kind = "beat_repeat"
at_sec = 102.0
len_beats = 4

# echo tail as the breakdown hands over to Detsl.
[[fx]]
kind = "echo_out"
at_sec = 104.0
delay_ms = 175.0
feedback = 0.6
len_beats = 6

# tape-stop power-down to end the finale.
[[fx]]
kind = "tape_stop"
at_sec = 181.0
len_beats = 4

# ──────────────────────────────── master ──────────────────────────────────
[[master]]
plugin = "eq"
# 7 HP Hz · 1 Low Gain · 5 High Freq · 6 High Gain — club low-end + air.
params = { "7" = 30.0, "1" = 1.5, "5" = 7000.0, "6" = 2.5 }

[[master]]
plugin = "compressor"
params = { "0" = -16.0, "1" = 2.0, "2" = 30.0, "3" = 200.0, "5" = 2.0 }

[[master]]
plugin = "limiter"
# 0 Input dB (push for club loudness) · 1 Ceiling dBTP.
params = { "0" = 8.0, "1" = -1.0 }
