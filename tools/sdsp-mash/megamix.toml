# Prodigy Megamix (AI v1) — a cypher built from the user's "Prodigy Mix" CSV
# dramaturgy. Each section is its own tempo island (vocal never stretched, beat
# stretched to the vocal's grid), joined by varied transitions + performance FX.
#
#   cargo run --release -p sdsp-mash -- tools/sdsp-mash/megamix.toml out_megamix.wav
#
# Sections (start_sec / bpm / transition):
#   S1  0 s   130  —          Breathe  × Кино «Хочу перемен» (singalong)
#   S2  52 s  161  drop       Voodoo People × Oxxxymiron «Агент» (high-energy rap)
#   S3  104 s 111  breakdown  Baby's Got A Temper × Detsl «Кто там у руля»
#   S4  156 s 142  cut        Firestarter instrumental finale → tape_stop
#
# FX: riser (auto, before the S2 drop) · beat_repeat (before the S3 switch) ·
#     echo_out (S3 breakdown tail) · tape_stop (finale).

bpm = 130   # global default; each section overrides with its own bpm + start_sec

# Opener sweep on the beat bus.
[intro_sweep]
bars = 8
from_hz = 300.0
to_hz = 20000.0

# Sidechain: only the melodic `other` bus ducks under the vocal.
[duck]
threshold_db = -28.0
ratio = 2.5
attack_ms = 8.0
release_ms = 140.0

