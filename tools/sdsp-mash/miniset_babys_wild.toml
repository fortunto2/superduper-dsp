# Mini-set #2 — Baby's Got A Temper × Detsl × Oxxxymiron (one beat, two rappers).
#
#   cargo run --release -p sdsp-mash -- tools/sdsp-mash/miniset_babys.toml out.wav
#
# One Prodigy beat (Baby's Got A Temper, 106 → 111 grid) carries two Russian
# rap verses that sit on the same tempo (compat map: both ~111 BPM):
#   Detsl «Кто там у руля» (111) → Oxxxymiron «Организация» (112).
# One continuous beat, two vocals at different offsets, a beat-repeat handoff
# between them, tape-stop finale.

bpm = 111.0
preset = "wild"

[intro_sweep]
bars = 8
from_hz = 300.0
to_hz = 20000.0

[duck]
threshold_db = -28.0
ratio = 2.5
attack_ms = 8.0
release_ms = 140.0

# v2.2 wild — breathing pump + filter breathing.
[pump]
depth_db = 4.5
release_ms = 135.0

[breath]
every_bars = 16
len_bars = 4
from_hz = 30.0
to_hz = 600.0

[[section]]
name = "Baby's Got A Temper × Detsl × Организация"
start_beat = 0
start_sec = 0.0
bpm = 111.0

