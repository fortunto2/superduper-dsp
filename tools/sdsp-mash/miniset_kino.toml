# Mini-set #3 — Breathe × Кино (a melodic singalong on a Prodigy beat).
#
#   cargo run --release -p sdsp-mash -- tools/sdsp-mash/miniset_kino.toml out.wav
#
# One Prodigy beat (Breathe, 130) carries two Кино anthems that sit on their own
# tempi (beat re-stretched per section):
#   «Хочу перемен» (129.6, ratio ~1.00) → «Звезда по имени Солнце» (117.6, ratio ~1.10).
# A breakdown hands the first anthem to the second; tape-stop closes it.
#
# Sections (start_sec / bpm / transition):
#   S1  0 s    129.6  —          Breathe × «Хочу перемен»
#   S2  50 s   117.6  breakdown  Breathe × «Звезда по имени Солнце»
#   S3  100 s  117.6  cut        Breathe instrumental → tape_stop

bpm = 129.6

[intro_sweep]
bars = 8
from_hz = 300.0
to_hz = 20000.0

[duck]
threshold_db = -28.0
ratio = 2.5
attack_ms = 8.0
release_ms = 140.0

