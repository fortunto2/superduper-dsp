# Mini-set #1 — Smack My Bitch Up × Сигма Бой (v3, no jingle).
#
#   cargo run --release -p sdsp-mash -- tools/sdsp-mash/miniset_smbu.toml out.wav
#
# Counter-stretch on a common 130 grid: SMBU beat 136→130 (−4.4%, groove intact)
# meets «Сигма Бой» vocal 125.17→130 (+3.9%, within the ±5% pop-vocal tolerance).
# Сигма Бой стаёт lead. The old «Утиные истории» Disney jingle is gone —
# replaced by a straight breakdown→drop between the two verses.
#
# Censored SMBU hook (EDL [[phrase]] throws, onset-cut from the vocal stem):
#   predominantly the answer phrase "change my pitch up" (77.5 s) on the intro,
#   the build, and just after the drop; the explicit "smack my bitch up"
#   (251.3 s) exactly ONCE, quiet (−9 dB) and dub-thrown, buried in the sub-drop
#   on the downbeat.
#
# Sections (start_sec / bpm / transition):
#   S1  0 s    130  —      SMBU × Сигма Бой (verse 1)
#   S2  48 s   130  drop   riser build → SMBU × Сигма Бой (verse 2) → tape_stop

bpm = 130.0
preset = "wild"

[intro_sweep]
bars = 8
from_hz = 300.0
to_hz = 20000.0

[duck]
threshold_db = -28.0
ratio = 2.5
attack_ms = 8.0
release_ms = 140.0

# v2.2 «жизнь» — breathing pump on the whole mix + periodic filter breathing.
[pump]
depth_db = 6.0
release_ms = 120.0

[breath]
every_bars = 8
len_bars = 4
from_hz = 30.0
to_hz = 600.0

