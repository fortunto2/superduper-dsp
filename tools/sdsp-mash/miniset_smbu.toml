# ──────────────── censored SMBU hook — EDL throws from the vocal stem ────────
# One source (the SMBU vocal stem, un-stretched — the stabs are one-shots, not a
# groove); phrases cut the couplet halves by onset and place them on the grid.
[[source]]
name = "smbuhook"
path = "/private/tmp/claude-501/-Users-rustam-Music-1music/393ad8d2-47d0-4106-9e37-cd08541e3195/scratchpad/mash/htdemucs/04. Smack My Bitch Up/vocals.wav"

