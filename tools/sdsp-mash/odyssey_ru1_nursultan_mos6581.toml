# Odyssey (ru) #1 — Опиа «Я умираю в Нур-Султане» × Carbon Based Lifeforms «MOS 6581»
# 120.02 vs 119.98 BPM — the tightest pair found (0.03%). Both ratio 1.0, no stretch at all.
# Theme: exile / dying far from home — the Odyssey's nostos, in Russian.
# Vocal stem lives in ~/Music/DJ/Sets/AI Mashups/_stems/ (NOT scratchpad — that gets wiped).
bpm = 120.0

[intro_sweep]
bars = 4
from_hz = 250.0
to_hz = 20000.0

[duck]
threshold_db = -26.0
ratio = 2.0
attack_ms = 10.0
release_ms = 200.0

# CBL — the bed (beat-other so the ducker can open room for the voice)
[[track]]
path = "/Users/rustam/Music/Albums/Carbon Based Lifeforms - Discography [2003 - 2023] 320/Albums/(2003) Hydroponic Garden/(2003) Hydroponic Garden (inre 009)/03. MOS 6581 (Album Version).mp3"
role = "beat-other"
gain_db = 0.0
tempo_ratio = 1.0
start_sec = 90.0
len_sec = 112.0

# Опиа — vocal, in after 8 bars, taken from the hot late section (RMS scan: 112 s)
[[track]]
path = "/Users/rustam/Music/DJ/Sets/AI Mashups/_stems/Опиа - Я умираю в Нур-Султане (vocals).wav"
role = "vocal"
gain_db = 1.0
