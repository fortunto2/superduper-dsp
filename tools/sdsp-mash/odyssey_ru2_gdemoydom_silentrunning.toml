# Odyssey (ru) #2 — IC3PEAK «Где мой дом?» × Carbon Based Lifeforms «Silent Running»
# Vocal 101.43, beat 99.86 → counter-stretch onto a 100.6 grid: vocal +0.8%, beat -0.7%.
# Theme: «где мой дом» — the question Odysseus spends ten years on.
# Vocal stem lives in ~/Music/DJ/Sets/AI Mashups/_stems/ (NOT scratchpad — that gets wiped).
bpm = 100.6

[intro_sweep]
bars = 4
from_hz = 250.0
to_hz = 20000.0

[duck]
threshold_db = -26.0
ratio = 2.0
attack_ms = 10.0
release_ms = 200.0

# CBL — the bed (beat-other so the ducker can open room for the voice)
[[track]]
path = "/Users/rustam/Music/Albums/Carbon Based Lifeforms - Discography [2003 - 2023] 320/Albums/(2003) Hydroponic Garden/(2003) Hydroponic Garden (inre 009)/04. Silent Running.mp3"
role = "beat-other"
gain_db = 0.0
tempo_ratio = 0.9926
start_sec = 70.0
len_sec = 118.0

# IC3PEAK — vocal, hot window per RMS scan (56 s)
[[track]]
path = "/Users/rustam/Music/DJ/Sets/AI Mashups/_stems/IC3PEAK - Где мой дом (vocals).wav"
role = "vocal"
gain_db = 2.0
tempo_ratio = 1.0083
offset_beats = 32
start_sec = 48.0
len_sec = 105.0
highpass_hz = 110.0

[[fx]]
kind = "breath"
at_sec = 40.0
len_beats = 8

[[fx]]
kind = "tape_stop"
at_sec = 98.0
len_beats = 8

[[fx]]
kind = "echo_out"
at_sec = 101.0
delay_ms = 500.0
feedback = 0.5

[[master]]
plugin = "eq"
params = { "7" = 30.0, "1" = 1.5, "5" = 7000.0, "6" = 2.5 }

[[master]]
plugin = "compressor"
params = { "0" = -16.0, "1" = 2.0, "2" = 30.0, "3" = 200.0, "5" = 2.0 }

[[master]]
plugin = "limiter"
params = { "0" = 2.8, "1" = -2.8 }
