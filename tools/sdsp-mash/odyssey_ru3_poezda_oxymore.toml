# Odyssey (ru) #3 — Женя Трофимов «Поезда» × Jean-Michel Jarre «Oxymore»
# Vocal 97.88, beat 99.94 → 99.0 grid: vocal -1.1%, beat +1.0%. Counter-stretch, both tiny.
# Theme: trains, leaving, the road out — the departure half of the journey.
# Vocal stem lives in ~/Music/DJ/Sets/AI Mashups/_stems/ (NOT scratchpad — that gets wiped).
bpm = 99.0

[intro_sweep]
bars = 4
from_hz = 250.0
to_hz = 20000.0

[duck]
threshold_db = -26.0
ratio = 2.0
attack_ms = 10.0
release_ms = 200.0

# CBL — the bed (beat-other so the ducker can open room for the voice)
[[track]]
path = "/Users/rustam/Music/Albums/Jean-Michel Jarre - Oxymore (2022)/Jean-Michel Jarre - Oxymore.mp3"
role = "beat-other"
gain_db = 0.0
tempo_ratio = 1.0095
start_sec = 40.0
len_sec = 116.0

# Женя Трофимов — vocal, hot window per RMS scan (60 s)
[[track]]
path = "/Users/rustam/Music/DJ/Sets/AI Mashups/_stems/Женя Трофимов - Поезда (vocals).wav"
role = "vocal"
gain_db = 1.5
tempo_ratio = 0.9887
offset_beats = 32
start_sec = 52.0
len_sec = 110.0
highpass_hz = 110.0

[[fx]]
kind = "breath"
at_sec = 40.0
len_beats = 8

[[fx]]
kind = "tape_stop"
at_sec = 98.0
len_beats = 8

[[fx]]
kind = "echo_out"
at_sec = 101.0
delay_ms = 500.0
feedback = 0.5

[[master]]
plugin = "eq"
params = { "7" = 30.0, "1" = 1.5, "5" = 7000.0, "6" = 2.5 }

[[master]]
plugin = "compressor"
params = { "0" = -16.0, "1" = 2.0, "2" = 30.0, "3" = 200.0, "5" = 2.0 }

[[master]]
plugin = "limiter"
params = { "0" = 2.8, "1" = -2.8 }
