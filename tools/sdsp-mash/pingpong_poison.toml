# Auto-pingpong cypher — Poison × Detsl × Oxxxymiron (Prodigy-flavoured).
#   sdsp-mash tools/sdsp-mash/pingpong_poison.toml out.wav
# Grid 108. Prodigy "Poison" 104.06 → 108 = +3.8% (breakbeat, in budget). Detsl
# 109.84 → 108 = -1.7%, Организация 110.06 → 108 = -1.9%. The only Prodigy beat
# near the ~110 rap tempo — keeps the Prodigy-set theme.

bpm = 108.0
preset = "wild"

[intro_sweep]
bars = 8
from_hz = 300.0
to_hz = 20000.0

[duck]
threshold_db = -28.0
ratio = 2.5
attack_ms = 8.0
release_ms = 140.0

[pump]
depth_db = 4.5
release_ms = 135.0

[breath]
every_bars = 16
len_bars = 4
from_hz = 30.0
to_hz = 600.0

