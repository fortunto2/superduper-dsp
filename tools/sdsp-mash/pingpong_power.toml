start_sec = 8.0
len_sec = 122.0

# ── vocal sources for the pingpong (counter-stretched to grid 110) ──
[[source]]
name = "detsl"
path = "/private/tmp/claude-501/-Users-rustam-Music-1music/393ad8d2-47d0-4106-9e37-cd08541e3195/scratchpad/mash/htdemucs/Detsl aka Le Truk - Кто там у руля/vocals.wav"
tempo_ratio = 0.9985
start_sec = 24.0
len_sec = 48.0

[[source]]
name = "oxxxy"
path = "/private/tmp/claude-501/-Users-rustam-Music-1music/393ad8d2-47d0-4106-9e37-cd08541e3195/scratchpad/mash/htdemucs/Oxxxymiron - Организация/vocals.wav"
tempo_ratio = 1.0006
start_sec = 96.0
len_sec = 48.0

[pingpong]
vocals = ["detsl", "oxxxy"]
phrase_beats = 4
loop_prob = 0.15
pitch_prob = 0.0
seed = 7
start_beat = 16
end_beat = 216   # beat ends at 120.8s = beat 221 — no a-cappella tail
gain_db = -3.0

[[master]]
plugin = "eq"
params = { "7" = 30.0, "1" = 1.5, "5" = 7000.0, "6" = 2.5 }

[[master]]
plugin = "compressor"
params = { "0" = -16.0, "1" = 2.0, "2" = 30.0, "3" = 200.0, "5" = 2.0 }

[[master]]
plugin = "limiter"
params = { "0" = 2.8, "1" = -2.8 }
