# Yukimatsu-style set — Part 01: "I Feel Love" cold-open (Donna Summer,
# solo track, own stems). Eclectic disco/proto-techno scene-setter — the
# classic-into-electronic move his cover-sets favor. Tempo-boost recipe:
# +3.4% (125.76 -> 130), one continuous groove take (the song's own
# 130s "chorus" zone is already a hypnotic 4-on-the-floor loop, no need
# to re-loop it). Long groove-only tail for a BLEND transition into Part 02.
#
#   cargo run --release -p sdsp-mash -- tools/sdsp-mash/yuki_01_donna_summer_open.toml out.wav

bpm = 130.0

[intro_sweep]
bars = 4
from_hz = 250.0
to_hz = 16000.0

[duck]
threshold_db = -24.0
ratio = 2.0
attack_ms = 10.0
release_ms = 150.0

[breath]
every_bars = 16
len_bars = 4
from_hz = 30.0
to_hz = 500.0

