[project]
name = "sdsp-score"
version = "0.1.0"
description = "Theme -> arranged score on SuperDuper DSP instruments: form, textures, drums, MIDI, stems"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
sdsp-score = "sdsp_score.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdsp_score"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
